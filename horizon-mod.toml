# Slices 1-17 of the Powah port, as one flat SDK package: the carried blocks, items, models,
# textures, recipes, loot, tags and lang are the `assets/` and `data/` beside `src/`, and the
# behaviour is the one `impl Hooks` there. Licence: LGPL-3.0-only (Technici4n/Powah); the full
# text and its provenance are in LICENSE and LICENSE-NOTICE.md inside this package. Local-only
# until the maintainer approves publishing (ARCHITECTURE.md §8).
id = "powah"
name = "Powah"
version = "0.2.18"
description = """A port of Powah! (Rearchitected) for Horizon, slice 1: the starter tier of the energy
chain. The Furnator burns a furnace fuel into carbon and makes 20 FE/t into a 20,000 FE buffer
(one coal is 48,000 FE); the Energy Cell is a 1,000,000 FE capacitor that takes and gives 1,000
FE a side; the Energy Cable moves up to 500 FE/t between the block entities beside it and stores
nothing. All three declare a real block energy capability, so other machines can fill and drain
them. `/powah info|set` are the operator-only (level 2) harness controls (slice 1 has no GUI).
Slice 2 carries the dielectric/capacitor crafting family — dielectric paste, rods, casing and the
basic capacitor (six items, eight recipes) — so the three machine recipes craft.
Slice 3 makes a run of cables one network: every cable connected through cables forwards the same
charge (up to 500 FE/t for the network), so a cell three cables away from another is charged.
Slice 4 completes the energy cell ladder: the basic, hardened, blazing, niotic, spirited and nitro
cells carry their own capacity (4M/10M/40M/100M/400M/2G FE) and per-side transfer (4,000 up to
2,000,000 FE/t); `/powah set` clamps a cell at its tier's capacity.
Slice 5 carries the Energizing Orb: seven slots whose inputs match one of seven energizing recipes,
a buffer filled by the energizing rods (seven tiers, 10,000 up to 20,000,000 FE, within four
blocks), and the materials it makes — energized steel, the blazing, niotic, spirited and nitro
crystals and the ender core — so the five higher cell tiers, the large capacitor, the higher
capacitor and rod tiers and the ender cells and gates craft.
Slice 6 completes the furnator and cable ladders: six more furnators (80/200/800/2,000/8,000/40,000
FE/t into their own 80k…40M buffers, each giving at its own per-side rate) and six more cables
(2,000 up to 1,000,000 FE/t), a network joining only its own tier's cables.
Slice 7 adds the item-energy family: a machine's own item carries its buffer when the machine is
broken (every furnator, cell and rod keeps its FE, and placing the item puts it back clamped to the
tier), and a furnator charges the item in its charge slot while a cell charges two, each step
exactly min(transfer, stored, room) out of the machine's own buffer.
Slice 8 adds the energy discharger, the cell's mirror: seven tiers (1M/1,000 up to 2G/2,000,000 FE),
a buffer that takes nothing through any face, and seven slots whose energy items it drains into that
buffer at min(the item's charge, the tier's transfer, the buffer's room) a tick — read through each
item's own energy capability, so a cell item placed there gives up its charge.
Slice 9 adds the energy hopper: seven tiers of a 1M…2G FE storage block with no slots of its own that
charges the container on the face its `facing` names, at 500…1,000,000 FE a tick a slot out of its own
buffer, giving and taking its tier's transfer on every face.
Slice 10 adds the solar panel: seven tiers (20…2,000 FE/t into the furnator's 20k…40M buffer), each
generating only while it sees the sky above it (the level's `can_see_sky` and `get_sky_darken`, so a
stone overhead or midnight stops it), charging one item in its slot, keeping its buffer on its item
and giving FE on its bottom face only; the photoelectric pane that the starter panel is built from
comes with it.
Slice 11 adds the ender cell and the ender gate, seven tiers each: one shared energy channel per
owner (upstream's `EnderNetwork`), so two blocks on a channel hold and give the same FE from
anywhere in the level. The cell answers all six faces and can be extended by inserting an energy
cell item into it, which adds that cell's capacity and charge to the channel; the gate answers and
pushes only on the face its `facing` names, moves at the cable's rate and cannot extend the network.
The channels survive breaking the blocks and relaunching the world, because they are the world's
data and not the block's.
Slice 12 adds the player transmitter, seven tiers: a 1M…2G FE buffer that charges the inventory of
the player a binding card is bound to, at 500…1,000,000 FE a tick, out of its own buffer — every
item through its own energy handler, so an energy cell carried by that player takes the charge. The
binding card is the item that names the player (`powah:bound_player`, bound by using it), with the
blank card, the aerial pearl and the player aerial pearl its recipes are built from.
Slice 13 adds the redstone mode upstream's GUI button sets: every machine that offers the button
reads it in its own tick (IGNORE always runs, ON only while a neighbour powers the block, OFF only
while none does), saved as `redstone_mode` in the block entity's own data, and
`/powah redstone <ignore|on|off> <pos>` is the button's replacement.
Slice 14 adds the comparator reading: a vanilla comparator beside a buffered machine reads the
fraction of its buffer upstream's `Energy.toComparatorPower()` computes (the number `/powah info`
already printed), and the reading follows the buffer — a changed strength tells the comparators
beside the machine to read it again. It is declared for the machines whose readout prints a
comparator (every furnator, cell, discharger, hopper, solar panel, ender cell, ender gate and
player transmitter); a cable stores nothing and the orb and the rods print no comparator, so they
answer none rather than a wrong number.
Slice 15 finishes the family: the energizing orb answers the number of its non-empty inventory
stacks (capped at 15), and an energizing rod answers the fraction of its own buffer (upstream's
`AbstractEnergyStorage`: `(int)(stored / capacity * 15)`, so half full reads 7). A cable stores
nothing and still answers no signal.
Slice 16 closes the side config: every machine whose tile owns a `SideConfig` saves six per-face
transfer types (`all`, `extract`/give-only, `receive`/take-only, `none`) under `side_transfer_type`,
and the port's own per-face movers honour them. The defaults are upstream's own — a storage
defaults to `all` on six faces, while a furnator, a solar panel and a discharger default to
`extract` — and the pin's `ModEnergyBuffer` can only declare face booleans, so the four-type
config is carried as six saved ordinals. `/powah side <pos>` reads all six faces and
`/powah side <face> <type> <pos>` replaces the wrench button, with no change to `/powah info`.
Slice 17 adds the creative energy cell: upstream's `EnergyCellTile.isCreative()` makes it a source
whose transfer type is `EXTRACT`, whose first tick fills it, and whose simulated `extractEnergy`
means giving FE never drops its buffer. Upstream's `Energy.MAX` (9e18) is clamped to the SDK's
`i32` — 2,147,483,647 FE — for both its capacity and its per-side transfer. Its `/powah info` line
keeps the cell's exact formatting with a trailing `creative` field, and a cable carries 500 FE/t
out of it into an empty cell without the source ever losing FE.
Slice 18 adds the seven energy battery items (starter 1M/1,000 up to nitro 2G/2,000,000 FE): each is
an ITEM_ENERGY buffer over the same `devices.batteries` config row as the cells, chargeable by a
machine's slot and drained by a discharger through the item capability. The seven jar recipes craft.
All seven rows fit the SDK's i32 energy type — upstream's 2,000,000,000 FE nitro capacity is below
i32::MAX, so no clamp is needed (the creative cell's 9e18 was the case that needed one).
Not yet ported: the magmator and thermo generators, the reactors, the Lens of Ender, the
dimensional binding card and the GUIs."""
authors = ["owmii", "Technici4n", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried assets/ and data/. The id is the resource namespace and the only identity.
api = "0.2"
# "both" is the installation side, not a hook's: the machines run on the server, and a LAN host
# or single-player world runs it inside the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this package's content declares its blocks, their items and one block entity type per
# machine kind.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
