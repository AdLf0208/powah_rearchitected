[package]
# Port of Powah! (Rearchitected) 6.2.10 (Technici4n/Powah, LGPL-3.0-only) to Horizon 26.3
# at the pin in horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour
# (FINDINGS.md); local-only until publishing is approved, publishable under the LGPL
# with this complete corresponding source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "powah"
version = "0.2.21"
edition = "2024"
license = "LGPL-3.0-only"
description = "Powah for Horizon: the seven-tier Furnator, Energy Cell, Energy Cable, Energy Discharger and Solar Panel ladders with their cable network, the dielectric/capacitor family, the Energizing Orb with its rod ladder and materials, the seven-tier Energy Hopper that charges the container it faces, the seven-tier Ender Cell and Ender Gate channel network, the item-energy family (a broken machine's item carries its buffer, machines charge the items in their slots and a discharger drains them), the seven-tier Player Transmitter that charges the inventory of the player its binding card names, the redstone mode every machine reads in its own tick, the comparator reading the buffered machines answer, and the orb's stack-count and the rod's own-buffer comparator readings, the six per-face transfer types every machine saves and enforces, and the creative energy cell, an extract-only source that gives 500 FE/t through a cable without its buffer ever dropping, and the seven energy battery items (start 1M/1,000 to nitro 2G/2,000,000 FE) as ITEM_ENERGY buffers over the devices.batteries config row, and the wrench, a plain item whose right-click advances the clicked machine face through the jar's transfer-type cycle, or with /powah wrench mode rotate steps its facing block state to the jar's next Direction.values() entry, and in link mode links a rod to an orb over two clicks with the artefact's range check"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command
# (the launcher builds against its own copy of the same build). Any other registry dependency
# must be pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
